<style>
  .home-body{
    --ink:#101826; --ink-soft:#3A4456; --paper:#F5F4EE; --surface:#FFFFFF;
    --teal:#0F6E66; --teal-deep:#0A4F49; --coral:#E2572B; --slate:#68707D; --line:#E4E1D6;
    background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
    background-image:radial-gradient(circle, #DAD6C7 1px, transparent 1px); background-size:22px 22px;
  }
  .home-body *{ box-sizing:border-box; }
  .home-body .wrap{ max-width:760px; margin:0 auto; padding:56px 24px 72px; }
  .home-body .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--teal-deep); font-weight:600; }
  .home-body h1{ font-family:'Fraunces',serif; font-weight:600; font-size:2.2rem; margin:10px 0 28px; }
  .home-body .person-layout{ display:grid; grid-template-columns:220px 1fr; gap:36px; align-items:start; }
  .home-body .person-photo{ width:100%; border-radius:12px; border:1px solid var(--line); object-fit:cover; aspect-ratio:4/5; }
  .home-body .field{ margin-bottom:24px; }
  .home-body .field-label{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--teal-deep); font-weight:600; display:block; margin-bottom:8px; }
  .home-body .field p{ margin:0 0 10px; font-size:.95rem; color:var(--ink-soft); line-height:1.65; }
  .home-body .field .org{ font-weight:600; color:var(--ink); }
  .home-body a{ color:var(--teal); }
  .home-body .timeline{ display:flex; flex-direction:column; gap:16px; }
  .home-body .timeline .step{ position:relative; padding-left:18px; }
  .home-body .timeline .step::before{ content:""; position:absolute; left:0; top:6px; width:7px; height:7px; border-radius:50%; background:var(--coral); }
  .home-body .step-when{ font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--slate); display:block; }
  .home-body .step-what{ font-weight:600; font-size:.95rem; color:var(--ink); }
  @media (max-width:640px){ .home-body .person-layout{ grid-template-columns:1fr; } }
</style>
