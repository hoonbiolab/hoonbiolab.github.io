<style>
  html, body{ font-size:18px !important; }
  body > header.md-header,
  body [data-md-component="header"],
  body [data-md-component="navigation"],
  body [data-md-component="toc"],
  body .md-sidebar,
  body .md-footer,
  h1 > .badge{ display:none !important; }
  body .md-main__inner{ margin:0 !important; display:block !important; }
  body .md-content, body .md-content__inner{ max-width:none !important; margin:0 !important; padding:0 !important; }
  body .md-container{ display:block !important; }

  .home-body{
    --ink:#101826; --ink-soft:#3A4456; --paper:#F5F4EE; --surface:#FFFFFF;
    --teal:#0F6E66; --teal-deep:#0A4F49; --coral:#E2572B; --coral-soft:#F7E4DC;
    --slate:#68707D; --line:#E4E1D6;
    background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
    background-image:radial-gradient(circle, #DAD6C7 1px, transparent 1px); background-size:22px 22px;
    min-height:100vh;
  }
  .home-body *{ box-sizing:border-box; }
  .home-body a{ color:var(--teal); }

  .back-home-pill{
    position:fixed; top:16px; left:16px; z-index:60;
    display:inline-flex; align-items:center; gap:6px;
    background:#101826; color:#fff; text-decoration:none;
    font-family:'IBM Plex Mono',monospace; font-size:.8rem; font-weight:600;
    padding:8px 14px; border-radius:999px; box-shadow:0 8px 20px -8px rgba(16,24,38,.4);
  }
  .back-home-pill:hover{ background:#0A4F49; }

  /* Full-width profile template (used by every /people/ page) */
  .profile-hero{ padding:72px 0 48px; text-align:center; border-bottom:1px solid var(--line); }
  .profile-hero .outer{ max-width:1320px; margin:0 auto; padding:0 40px; }
  .profile-photo{
    width:230px; height:288px; object-fit:cover; border-radius:16px; border:1px solid var(--line);
    margin:0 auto 26px; display:block; box-shadow:0 22px 50px -28px rgba(16,24,38,.3);
  }
  .profile-hero .eyebrow{
    display:block; margin-bottom:10px; font-family:'IBM Plex Mono',monospace; font-size:.8rem;
    letter-spacing:.16em; text-transform:uppercase; color:var(--teal-deep); font-weight:600;
  }
  .profile-hero h1{ font-family:'Fraunces',serif; font-weight:600; font-size:2.7rem; margin:0; color:var(--ink); }

  .profile-body{ padding:48px 0 96px; }
  .profile-body .inner{ max-width:760px; margin:0 auto; padding:0 40px; }
  .profile-field{ margin-bottom:0; padding:28px 0; border-top:1px solid var(--line); }
  .profile-field:first-child{ border-top:none; padding-top:0; }
  .profile-field-label{
    font-family:'IBM Plex Mono',monospace; font-size:.78rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--teal-deep); font-weight:600; display:block; margin-bottom:10px;
  }
  .profile-field p{ margin:0 0 12px; font-size:1.02rem; color:var(--ink-soft); line-height:1.7; }
  .profile-field p:last-child{ margin-bottom:0; }
  .profile-field .org{ font-weight:600; color:var(--ink); }
  .profile-timeline{ display:flex; flex-direction:column; gap:20px; }
  .profile-timeline .step{ position:relative; padding-left:20px; }
  .profile-timeline .step::before{ content:""; position:absolute; left:0; top:7px; width:8px; height:8px; border-radius:50%; background:var(--coral); }
  .profile-step-when{ font-family:'IBM Plex Mono',monospace; font-size:.76rem; letter-spacing:.06em; text-transform:uppercase; color:var(--slate); display:block; }
  .profile-step-what{ font-weight:600; font-size:1.02rem; color:var(--ink); }
  @media (max-width:640px){ .profile-hero h1{ font-size:2.1rem; } .profile-photo{ width:190px; height:238px; } }
</style>
<a class="back-home-pill" href="{{ site.url }}/">&larr; Hoon Bio Lab</a>
