<style>
  /* Force root font-size: the old theme sets html{font-size:62.5%} which
     shrinks every rem-based measurement across our design. Reset it,
     and push it slightly above 16px since even 16px still read small. */
  html, body{ font-size:18px !important; }

  /* Hide every remnant of the old Material-for-MkDocs-style theme chrome
     (top header, left sidebar, right table-of-contents sidebar, badges
     injected by tags.html) on any page that includes this file. */
  body > header.md-header,
  body [data-md-component="header"],
  body [data-md-component="navigation"],
  body [data-md-component="toc"],
  body .md-sidebar,
  body .md-footer,
  h1 > .badge{ display:none !important; }
  body .md-main__inner{ margin:0 !important; display:block !important; }
  body .md-content, body .md-content__inner{ max-width:none !important; margin:0 !important; padding:0 !important; }
  body .md-container{ display:block !important; }

  .home-body{
    --ink:#101826; --ink-soft:#3A4456; --paper:#F5F4EE; --surface:#FFFFFF;
    --teal:#0F6E66; --teal-deep:#0A4F49; --coral:#E2572B; --coral-soft:#F7E4DC;
    --slate:#68707D; --line:#E4E1D6;
    background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
    background-image:radial-gradient(circle, #DAD6C7 1px, transparent 1px); background-size:22px 22px;
  }
  .home-body *{ box-sizing:border-box; }
  .home-body a{ color:var(--teal); }

  /* Small fixed "back to home" pill for any page that doesn't carry the
     full site nav (used on subpages until they get the full treatment). */
  .back-home-pill{
    position:fixed; top:16px; left:16px; z-index:60;
    display:inline-flex; align-items:center; gap:6px;
    background:#101826; color:#fff; text-decoration:none;
    font-family:'IBM Plex Mono',monospace; font-size:.8rem; font-weight:600;
    padding:8px 14px; border-radius:999px; box-shadow:0 8px 20px -8px rgba(16,24,38,.4);
  }
  .back-home-pill:hover{ background:#0A4F49; }

  .wrap{ max-width:760px; margin:0 auto; padding:56px 24px 72px; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; color:var(--teal-deep); font-weight:600; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:2.3rem; margin:10px 0 28px; }
  .person-layout{ display:grid; grid-template-columns:220px 1fr; gap:36px; align-items:start; }
  .person-photo{ width:100%; border-radius:12px; border:1px solid var(--line); object-fit:cover; aspect-ratio:4/5; }
  .field{ margin-bottom:24px; }
  .field-label{ font-family:'IBM Plex Mono',monospace; font-size:.76rem; letter-spacing:.1em; text-transform:uppercase; color:var(--teal-deep); font-weight:600; display:block; margin-bottom:8px; }
  .field p{ margin:0 0 10px; font-size:1rem; color:var(--ink-soft); line-height:1.65; }
  .field .org{ font-weight:600; color:var(--ink); }
  .timeline{ display:flex; flex-direction:column; gap:16px; }
  .timeline .step{ position:relative; padding-left:18px; }
  .timeline .step::before{ content:""; position:absolute; left:0; top:6px; width:7px; height:7px; border-radius:50%; background:var(--coral); }
  .step-when{ font-family:'IBM Plex Mono',monospace; font-size:.74rem; letter-spacing:.06em; text-transform:uppercase; color:var(--slate); display:block; }
  .step-what{ font-weight:600; font-size:1rem; color:var(--ink); }
  @media (max-width:640px){ .person-layout{ grid-template-columns:1fr; } }
</style>
<a class="back-home-pill" href="{{ site.url }}/">&larr; Hoon Lab</a>
